name: 'Tests: node.js'

on: [pull_request, push]

jobs:
  test:
    name: 'node ${{ matrix.node-version }}'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x', '26.x']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: bash misc/install-rooster.sh
      - run: make init
      - run: 'echo "Using pinned test_files.zip fixtures; skipping optional live fixture refresh"'
      - name: Rebuild with the audited auxiliary toolchains
        if: matrix.node-version == '24.x'
        run: |
          npm ci --prefix modules
          npm audit --prefix modules --audit-level=low
          npm run build --prefix modules
          npm ci --prefix packages/otorp
          npm audit --prefix packages/otorp --audit-level=low
          npm run build --prefix packages/otorp
          npm run build
      - run: npm run tests-only

  package:
    name: 'build and pack'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm audit
      - name: Build and audit auxiliary TypeScript tools
        run: |
          npm ci --prefix modules
          npm audit --prefix modules --audit-level=low
          npm run build --prefix modules
          npm ci --prefix packages/otorp
          npm audit --prefix packages/otorp --audit-level=low
          npm run build --prefix packages/otorp
      - run: npm run build
      - run: PATH="$PWD/node_modules/.bin:$PATH" make dist
      - run: npm pack --dry-run
