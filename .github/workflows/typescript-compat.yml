name: 'Tests: TypeScript compatibility'

on: [pull_request, push]

permissions:
  contents: read

jobs:
  typings:
    name: 'typescript ${{ matrix.typescript-version }}'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        typescript-version:
          - '3.9.10'
          - '4.2.4'
          - '4.9.5'
          - '5.0.4'
          - '5.9.3'
          - '6.0.3'
          - '7.0.2'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run types-compat -- ${{ matrix.typescript-version }}
