name: 'Tests: node.js (io.js)'

on:
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.set-matrix.outputs.requireds }}
    steps:
      - uses: ljharb/actions/node/matrix@a50960f7a82dfdf815255483595fa3cef562c9de
        id: set-matrix
        with:
          type: 'majors'
          preset: 'iojs'

  latest:
    needs: [matrix]
    name: 'latest majors'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.latest) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ljharb/actions/node/install@a50960f7a82dfdf815255483595fa3cef562c9de
        name: 'nvm install ${{ matrix.node-version }} && npm install'
        with:
          node-version: ${{ matrix.node-version }}
          skip-ls-check: true
      - run: bash misc/install-rooster.sh
      - run: make init
      - run: 'echo "Using pinned test_files.zip fixtures; skipping optional live fixture refresh"'
      - run: npm run tests-only
      #- run: 'cd packages/ssf; npm run tests-only; cd -'

  node:
    name: 'io.js'
    needs: [latest]
    runs-on: ubuntu-latest
    steps:
      - run: 'echo tests completed'
